version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: events-db-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=events_db
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=123456
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
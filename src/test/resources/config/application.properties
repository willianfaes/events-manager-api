# Read besides src/main/resources/application.properties, only by tests. Never contacted: tests either use jwt() or
# mock the decoder (see SecurityConfigWebSliceTest).
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://issuer.test/pool

# Tests never reach Nominatim: this port refuses the connection at once, and the retry does not wait.
app.geocoding.base-url=http://localhost:1
resilience4j.retry.instances.geocoding.wait-duration=1ms

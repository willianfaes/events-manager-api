spring.application.name=events_manager
spring.profiles.active=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/events_manager_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:events_manager_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true

# The cache is optional: short timeouts keep a dead Redis from slowing the listing (Lettuce waits much longer by default).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms

# Exposes cache.gets (hit/miss) to Prometheus; the Grafana panel computes the hit ratio from it.
spring.cache.redis.enable-statistics=true

spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

spring.jpa.open-in-view=false

springdoc.swagger-ui.persist-authorization=true

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# A cache outage must not turn the app DOWN (the listing falls back to PostgreSQL).
management.health.redis.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# No default on purpose: the app refuses to start without a secret of at least 32 bytes.
jwt.secret=${JWT_SECRET:}
# Nome do projeto (mude de 'security' para o nome da sua API)(padrao ouro de mercado, tem que ter!)
spring.application.name=events-manager

# Configuração da Conexão (Endereço, Porta e Nome do Schema) | Substitua "your_database_name" pelo nome do seu banco de dados.
spring.datasource.url=jdbc:postgresql://localhost:5432/events_db
spring.datasource.username=admin
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# O Hibernate vai criar as tabelas baseado nas suas entidades (por enquanto)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.flyway.enabled=true
spring.application.name=events_manager
spring.profiles.active=local

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/events_manager_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:events_manager_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true

# The cache is optional: short timeouts keep a dead Redis from slowing the listing (Lettuce waits much longer by default).
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=6379
spring.data.redis.connect-timeout=200ms
spring.data.redis.timeout=200ms

# The broker defaults to localhost:9092 (SPRING_KAFKA_BOOTSTRAP_SERVERS overrides it). With the broker down, send() would
# wait 60 s for metadata before even failing; 5 s is enough, and the outbox row simply stays pending.
spring.kafka.producer.properties.max.block.ms=5000

# Exposes cache.gets (hit/miss) to Prometheus; the Grafana panel computes the hit ratio from it.
spring.cache.redis.enable-statistics=true

spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=20

spring.jpa.open-in-view=false

# The load balancer ends HTTPS and talks plain HTTP to the app: honor X-Forwarded-Proto/Port so the Location headers
# and the Swagger server URL keep https.
server.forward-headers-strategy=framework

springdoc.swagger-ui.persist-authorization=true
# Login on the Cognito hosted page from the Authorize button (`cognito_hosted_ui_url` and `cognito_client_id` in
# infra). Both are public. Without them the API still starts and only the pasted token is offered.
app.cognito.hosted-ui-url=${COGNITO_HOSTED_UI_URL:}
springdoc.swagger-ui.oauth.client-id=${COGNITO_CLIENT_ID:}
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true

# The demo user's sub (see `demo_user_sub` in infra): DataSeeder gives it a profile. Empty means no demo profile.
app.demo.user-sub=${DEMO_USER_SUB:}

# Nominatim asks for an identified User-Agent and at most one request per second.
app.geocoding.base-url=https://nominatim.openstreetmap.org
app.geocoding.user-agent=events-manager-api (https://github.com/willianfaes/events-manager-api)
app.geocoding.connect-timeout=1s
app.geocoding.read-timeout=2s

# Only network failures and 5xx are worth a second try; the wait respects the limit of one request per second.
resilience4j.retry.instances.geocoding.max-attempts=2
resilience4j.retry.instances.geocoding.wait-duration=1s
resilience4j.retry.instances.geocoding.retry-exceptions[0]=org.springframework.web.client.ResourceAccessException
resilience4j.retry.instances.geocoding.retry-exceptions[1]=org.springframework.web.client.HttpServerErrorException
# Traffic is low (an admin form), so a small window is enough to notice a provider that is down.
resilience4j.circuitbreaker.instances.geocoding.sliding-window-size=5
resilience4j.circuitbreaker.instances.geocoding.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.geocoding.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.geocoding.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.geocoding.permitted-number-of-calls-in-half-open-state=1

management.server.port=8081
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
# A cache outage must not turn the app DOWN (the listing falls back to PostgreSQL).
management.health.redis.enabled=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# The user pool that signs the tokens (see `cognito_issuer_uri` in infra). No default on purpose: without it the app
# cannot tell who is calling, so it refuses to start.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${COGNITO_ISSUER_URI}